<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.25"/>
  <!-- Top node -->
  <circle cx="256" cy="130" r="20" fill="#3B82F6" opacity="0.9"/>
  <line x1="256" y1="150" x2="256" y2="220" stroke="#3B82F6" stroke-width="3" opacity="0.8"/>
  <!-- Right nodes -->
  <circle cx="360" cy="200" r="16" fill="#22D3EE" opacity="0.9"/>
  <line x1="280" y1="240" x2="345" y2="210" stroke="#22D3EE" stroke-width="2.5" opacity="0.7"/>
  <circle cx="370" cy="320" r="14" fill="#34D399" opacity="0.9"/>
  <line x1="280" y1="280" x2="358" y2="315" stroke="#34D399" stroke-width="2" opacity="0.6"/>
  <!-- Bottom nodes -->
  <circle cx="256" cy="390" r="16" fill="#8B5CF6" opacity="0.9"/>
  <line x1="256" y1="290" x2="256" y2="374" stroke="#8B5CF6" stroke-width="2.5" opacity="0.7"/>
  <circle cx="150" cy="320" r="14" fill="#22D3EE" opacity="0.9"/>
  <line x1="230" y1="280" x2="160" y2="310" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="200" r="15" fill="#34D399" opacity="0.9"/>
  <line x1="230" y1="220" x2="162" y2="205" stroke="#34D399" stroke-width="2" opacity="0.6"/>
  <!-- Center hub -->
  <circle cx="256" cy="256" r="40" fill="#0B0F19" stroke="url(#g)" stroke-width="3"/>
  <circle cx="256" cy="256" r="22" fill="url(#g)"/>
  <circle cx="256" cy="256" r="8" fill="#0B0F19"/>
  <!-- Cross connections (subtle) -->
  <line x1="256" y1="150" x2="150" y2="200" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="150" x2="360" y2="200" stroke="#22D3EE" stroke-width="1" opacity="0.3"/>
  <line x1="150" y1="200" x2="150" y2="320" stroke="#34D399" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="200" x2="370" y2="320" stroke="#22D3EE" stroke-width="1" opacity="0.3"/>
  <!-- ECG pulse at bottom -->
  <polyline points="100,440 160,440 190,440 210,390 230,480 250,410 270,440 320,440 360,440 400,440 420,440 430,440" 
    fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>